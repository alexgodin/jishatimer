; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:seeed_xiao_esp32c3]
platform = espressif32
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = direct
build_flags =
	-Wunused-function
lib_deps =
     adafruit/Adafruit LIS3DH
     adafruit/RTClib
     olikraus/U8g2
; test_calibration is host-only math. Without this, a bare `pio test` collects
; it for this env too and dies on undefined setup()/loop() after a long build.
test_ignore = test_calibration

; Host-side unit tests for the pure RTC-calibration math (no hardware needed):
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<calibration.cpp>
